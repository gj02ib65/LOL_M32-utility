services:
  m32-sync:
    image: ghcr.io/gj02ib65/lol_m32-utility:latest
    container_name: m32-sync-utility
    restart: always
    # host networking is required for zero-latency UDP communication with the M32 consoles.
    # NOTE: When network_mode is "host", the ports: section is ignored by Podman/Docker.
    # The container uses the host's network stack directly — no port mapping needed.
    network_mode: "host"
    volumes:
      - m32_church_data:/data
      # The lol_m32-flows repo is mounted read-only as the flows source.
      # A startup script in the image copies flows.json into /data/ at container start.
      # IMPORTANT: This path assumes the following directory structure on the host:
      #   C:\                        (or any drive)
      #     m32-utility\             ← this repo (docker-compose.prod.yml lives here)
      #     m32-flows\               ← lol_m32-flows repo (cloned from GitHub)
      # If your directory layout is different, update the left side of this mount.
      - ../m32-flows:/opt/m32-flows-src:ro
    environment:
      - TZ=America/Chicago
      - NODE_RED_ENABLE_PROJECTS=false
      - CONFIG_FILE_PATH=/data/mixer_config.json
    # Loads the custom settings file so Node-RED finds the installed palette nodes.
    command: --settings /opt/m32-logic/settings.js

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    security_opt:
      - label=disable # Required for Podman to allow socket access
    volumes:
      # Rootless Podman on Windows exposes its socket via the Podman machine.
      # Run `podman machine inspect` to find your exact socket path if this doesn't work.
      - //./pipe/podman-machine-default:/var/run/docker.sock
    # Check for image updates every Monday at 3 AM
    command: --schedule "0 0 3 * * 1" --cleanup m32-sync-utility

volumes:
  m32_church_data:
